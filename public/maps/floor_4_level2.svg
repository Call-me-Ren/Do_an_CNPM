<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>
  <rect width="800" height="600" fill="url(#grid4)"/>

  <!-- Floor 3 Outer Boundary -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Hallway -->
  <rect x="350" y="60" width="100" height="480" fill="#334155" fill-opacity="0.4"/>
  <text x="400" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 400 310)">HÀNH LANG TẦNG 3 &amp; THANG BỘ</text>

  <!-- Room 5: Hồi niệm Requiem (WRM012 & WRM013) -->
  <rect x="70" y="70" width="260" height="460" rx="12" fill="#1e3a8a" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
  <rect x="90" y="140" width="220" height="360" rx="8" fill="#1e40af" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="200" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#60a5fa" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 5</text>
  <text x="200" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#93c5fd" text-anchor="middle">TRIỂN LÃM HỒI NIỆM (REQUIEM)</text>
  <text x="200" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dbeafe" text-anchor="middle">Máy ảnh phóng viên (WRM012)</text>
  <text x="200" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dbeafe" text-anchor="middle">Ảnh 'Sự tàn khốc bom đạn' (WRM013)</text>

  <!-- Room 6: Hòa bình (WRM014 & WRM015) -->
  <rect x="470" y="70" width="260" height="460" rx="12" fill="#065f46" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
  <rect x="490" y="140" width="220" height="360" rx="8" fill="#047857" fill-opacity="0.2" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 6</text>
  <text x="600" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">KHÁT VỌNG HÒA BÌNH THẾ GIỚI</text>
  <text x="600" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">Chim Bồ câu &amp; Tranh thiếu nhi (WRM014)</text>
  <text x="600" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d1fae5" text-anchor="middle">Bích họa 'Khát vọng hòa bình' (WRM015)</text>
</svg>
