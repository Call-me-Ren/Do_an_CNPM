<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>
  <rect width="800" height="600" fill="url(#grid2)"/>

  <!-- Floor 1 Outer Walls -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Central Hallway -->
  <rect x="350" y="60" width="100" height="480" fill="#334155" fill-opacity="0.4"/>
  <text x="400" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 400 310)">HÀNH LANG TẦNG 1 &amp; THANG BỘ</text>

  <!-- Room 1: Chế độ lao tù & Máy chém (WRM007) -->
  <rect x="70" y="70" width="260" height="460" rx="12" fill="#7f1d1d" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
  <rect x="90" y="140" width="220" height="360" rx="8" fill="#991b1b" fill-opacity="0.2" stroke="#f87171" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="200" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f87171" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 1</text>
  <text x="200" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">CHẾ ĐỘ LAO TÙ TRONG CHIẾN TRANH</text>
  <text x="200" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fecaca" text-anchor="middle">Máy chém 10/59 (WRM007)</text>

  <!-- Room 2: Thế giới ủng hộ kháng chiến (WRM008) -->
  <rect x="470" y="70" width="260" height="460" rx="12" fill="#14532d" fill-opacity="0.25" stroke="#22c55e" stroke-width="2"/>
  <rect x="490" y="140" width="220" height="360" rx="8" fill="#166534" fill-opacity="0.2" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4ade80" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 2</text>
  <text x="600" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">THẾ GIỚI ỦNG HỘ VIỆT NAM</text>
  <text x="600" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bbf7d0" text-anchor="middle">Huy hiệu &amp; Cờ phản chiến (WRM008)</text>
</svg>
