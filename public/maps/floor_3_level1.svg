<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>
  <rect width="800" height="600" fill="url(#grid3)"/>

  <!-- Floor 2 Outer Boundary -->
  <rect x="40" y="40" width="720" height="520" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Hallway -->
  <rect x="350" y="60" width="100" height="480" fill="#334155" fill-opacity="0.4"/>
  <text x="400" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 400 310)">HÀNH LANG TẦNG 2 &amp; THANG BỘ</text>

  <!-- Room 3: Tội ác chiến tranh (WRM009) -->
  <rect x="70" y="70" width="260" height="460" rx="12" fill="#78350f" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
  <rect x="90" y="140" width="220" height="360" rx="8" fill="#92400e" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="200" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 3</text>
  <text x="200" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">TỘI ÁC CHIẾN TRANH XÂM LƯỢC</text>
  <text x="200" y="320" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">Bộ tư liệu Tội ác Chiến tranh (WRM009)</text>

  <!-- Room 4: Chất độc da cam (WRM010 & WRM011) -->
  <rect x="470" y="70" width="260" height="460" rx="12" fill="#831843" fill-opacity="0.25" stroke="#ec4899" stroke-width="2"/>
  <rect x="490" y="140" width="220" height="360" rx="8" fill="#9d174d" fill-opacity="0.2" stroke="#f472b6" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f472b6" text-anchor="middle">PHÒNG TRƯNG BÀY SỐ 4</text>
  <text x="600" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle">HẬU QUẢ CHẤT ĐỘC DA CAM / DIOXIN</text>
  <text x="600" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fce7f3" text-anchor="middle">Thùng rải Dioxin (WRM010)</text>
  <text x="600" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fce7f3" text-anchor="middle">Ảnh 'Em bé Napalm' (WRM011)</text>
</svg>
