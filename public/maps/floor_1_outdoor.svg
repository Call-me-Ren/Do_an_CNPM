<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Outer yard boundary -->
  <rect x="40" y="30" width="720" height="540" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Walkway & Entrance -->
  <rect x="60" y="490" width="220" height="50" rx="8" fill="#d97706" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170" y="520" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">CỔNG CHÍNH (28 VÕ VĂN TẦN)</text>

  <!-- Main Museum Building Footprint -->
  <rect x="330" y="330" width="400" height="210" rx="10" fill="#090d16" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="530" y="440" font-family="sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">TÒA NHÀ TRƯNG BÀY CHÍNH (3 TẦNG)</text>
  <text x="530" y="465" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Lối vào các phòng trưng bày trong nhà</text>

  <!-- Tank Display Area (WRM001) -->
  <rect x="70" y="60" width="230" height="180" rx="12" fill="#14532d" fill-opacity="0.35" stroke="#22c55e" stroke-width="2"/>
  <rect x="90" y="110" width="190" height="110" rx="6" fill="#166534" fill-opacity="0.3" stroke="#4ade80" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="185" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">KHU XE TĂNG HẠNG NẶNG</text>
  <text x="185" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">Xe tăng M48A3 Patton (WRM001)</text>

  <!-- Fighter Jet & Daisy Cutter Bomb Area (WRM002 & WRM005) -->
  <rect x="330" y="60" width="220" height="230" rx="12" fill="#1e3a8a" fill-opacity="0.35" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">KHU TIÊM KÍCH &amp; BOM ĐẠN</text>
  <text x="440" y="150" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Northrop F-5A (WRM002)</text>
  <text x="440" y="240" font-family="sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Bom BLU-82 Daisy Cutter (WRM005)</text>

  <!-- Air Force & Transport Helicopters (WRM003 & WRM004) -->
  <rect x="570" y="60" width="160" height="230" rx="12" fill="#581c87" fill-opacity="0.35" stroke="#a855f7" stroke-width="2"/>
  <text x="650" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">KHU TRỰC THĂNG</text>
  <text x="650" y="140" font-family="sans-serif" font-size="11" fill="#d8b4fe" text-anchor="middle">CH-47 Chinook (WRM003)</text>
  <text x="650" y="220" font-family="sans-serif" font-size="11" fill="#d8b4fe" text-anchor="middle">UH-1 Huey (WRM004)</text>

  <!-- Tiger Cages Reconstruction (WRM006) -->
  <rect x="70" y="270" width="230" height="190" rx="12" fill="#7f1d1d" fill-opacity="0.35" stroke="#ef4444" stroke-width="2"/>
  <text x="185" y="300" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f87171" text-anchor="middle">KHU TÁI HIỆN CHUỒNG CỌP</text>
  <text x="185" y="380" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Chuồng Cọp Côn Đảo (WRM006)</text>
</svg>
